name: "📦 PNPM Setup and install"
description: "Common setup steps for Actions"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v3
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        version: 9.5.0

    - shell: bash
      run: pnpm add -g turbo

    - shell: bash
      run: pnpm install --frozen-lockfile
