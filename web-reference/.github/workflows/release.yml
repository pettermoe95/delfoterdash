name: 📗 Create Release PR

on:
  push:
    branches:
      - main

permissions:
  pull-requests: write
  contents: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: 🔧 Setup
        uses: ./tooling/github/setup
