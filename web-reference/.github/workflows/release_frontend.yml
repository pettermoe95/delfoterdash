name: 🏄 Release Frontend

on:
  push:
    tags:
      - brilliant-view@[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch:
    inputs:
      environment:
        required: true
        description: Environment to build and publish
        default: test
        type: choice
        options:
          - development
          - test
          - production

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-release_brilliant_view
  cancel-in-progress: true

jobs:
  release-brilliant-view:
    name: Release Brilliant View
    uses: ./.github/workflows/base_deploy_frontend.yml
    secrets: inherit
    with:
      app-name: brilliant-view
      image-name: brilliant-view
      environment: ${{ github.event_name == 'push' && 'test' || github.event.inputs.environment }}
